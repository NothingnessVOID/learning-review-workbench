name: Validate source and protocol
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/mcp-protocol-test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:http
      - run: npm run test:e2e
      - run: node scripts/long-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: |
            artifacts/screenshots/
            artifacts/ui-regression/
            artifacts/test-results/
