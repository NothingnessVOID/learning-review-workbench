name: Validate source and protocol
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/mcp-protocol-test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:http
      - run: npm run test:e2e
      - run: npm run test:habit-mcp
      - run: node scripts/habit-ui-test.mjs
      - run: node scripts/handoff-ui-test.mjs
      - run: node scripts/long-benchmark.mjs
      - run: node --import tsx scripts/third-relation-benchmark.mjs
      - run: node scripts/third-drafts-ui-test.mjs
      - run: node scripts/third-note-ui-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: |
            artifacts/screenshots/**/*.png
            artifacts/ui-regression/**/*.png
            artifacts/habit-regression/**/*.png
            artifacts/handoff-regression/**/*.png
            artifacts/third-review/**/*.png
            artifacts/test-results/third-relation-benchmark.json
            artifacts/test-results/third-targeted.txt
            artifacts/test-results/third-unit-final.txt
            artifacts/test-results/third-drafts-ui.log
            artifacts/test-results/third-note-ui.log
            artifacts/test-results/third-e2e.log
            artifacts/test-results/third-http.txt
            artifacts/test-results/third-habit-mcp.txt
